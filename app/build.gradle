plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services")

    id 'io.sentry.android.gradle' version '6.25.0'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.medicinoclinic"
        minSdk 26
        targetSdk 33
        versionCode 15
        versionName "1.0.15"

        // Live server and live Pusher app, used by every build (debug and release).
        // Only the Pusher KEY belongs here; the secret stays on the backend.
        buildConfigField "String", "BASE_URL", '"https://api.brightideainfotech.tech/"'
        buildConfigField "String", "VIDEO_URL", '"https://api.brightideainfotech.tech/storage/"'
        buildConfigField "String", "PUSHER_KEY", '"3ca5933d5ea7c2a5dd5c"'
        buildConfigField "String", "PUSHER_CLUSTER", '"ap2"'
    }

    allprojects {
        repositories {
            maven { url 'http://repo1.maven.org/maven2' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    namespace 'com.medicinoclinic'
}


dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.firebase:firebase-analytics:22.1.2'
    implementation 'com.google.firebase:firebase-messaging:24.0.2'
    implementation "androidx.work:work-runtime-ktx:2.9.1"
//    implementation 'com.github.RohanPatil1:SpeedMarquee:1.0.0'
    //ExoPlayer dependency
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.github.smarteist:Android-Image-Slider:1.4.0'
    implementation "com.github.bumptech.glide:glide:4.11.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.core:core-ktx:1.12.0' // Ensure latest core-ktx

    implementation(platform("com.google.firebase:firebase-bom:34.0.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")

    implementation 'com.pusher:pusher-java-client:2.4.2'


}


sentry {
    org = "sigosoft-eb"
    projectName = "medicino_tv"

    // source upload needs the auth token in sentry.properties; builds without it would fail
    includeSourceContext = false
}
